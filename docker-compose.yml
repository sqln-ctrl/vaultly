services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite:////data/vaultly.db
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "sqlite_data:/data"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
volumes:
  sqlite_data:
